<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>灵动玻璃球 · 设置页原型</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #f3f4f7;
      --surface: #ffffff;
      --surface-muted: #eceef2;
      --text: #1d2026;
      --muted: #747983;
      --blue: #1687f5;
      --blue-soft: #e2f0ff;
      --track: #c9cbd0;
      --line: #e3e5e9;
      --danger: #c93546;
      --radius-card: 24px;
      --radius-control: 16px;
      --space-card: 16px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--canvas); }
    body {
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body[data-variant="compact"] {
      --radius-card: 18px;
      --space-card: 10px;
    }

    button, input { font: inherit; }
    button { border: 0; cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 3px solid #78baff; outline-offset: 3px; }

    .prototype-banner {
      position: sticky;
      top: 0;
      z-index: 4;
      min-height: 32px;
      padding: 8px 20px;
      color: #5d626b;
      background: #e7e9ed;
      border-bottom: 1px solid var(--line);
      font-size: 12px;
      letter-spacing: .02em;
      text-align: center;
    }

    .screen {
      width: min(100%, 430px);
      min-height: 100svh;
      margin: 0 auto;
      padding: 26px 20px 124px;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      margin: 8px 2px 26px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.18;
      letter-spacing: -.04em;
    }

    .page { display: none; }
    .page.is-active { display: block; }

    .section-label {
      margin: 22px 2px 8px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.3;
    }

    .card {
      overflow: hidden;
      margin-bottom: var(--space-card);
      border: 1px solid rgba(0, 0, 0, .035);
      border-radius: var(--radius-card);
      background: var(--surface);
      box-shadow: 0 8px 24px rgba(30, 36, 48, .045);
    }

    .card-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding: 19px 20px 13px;
    }

    .card-title { margin: 0; font-size: 17px; font-weight: 650; }

    .setting-row {
      padding: 14px 20px 17px;
      border-top: 1px solid var(--line);
    }

    .setting-row:first-of-type { border-top: 0; }

    .setting-line {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 14px;
    }

    .setting-name { font-size: 15px; }
    .setting-value { color: var(--blue); font-size: 13px; font-variant-numeric: tabular-nums; }
    .setting-help { margin: 5px 0 11px; color: var(--muted); font-size: 12px; line-height: 1.45; }

    input[type="range"] {
      display: block;
      width: 100%;
      height: 28px;
      margin: 0;
      accent-color: var(--blue);
      cursor: pointer;
    }

    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      min-height: 62px;
      padding: 13px 20px;
      border-top: 1px solid var(--line);
    }

    .switch-row:first-of-type { border-top: 0; }
    .switch-copy { min-width: 0; }
    .switch-name { font-size: 15px; }
    .switch-help { margin-top: 5px; color: var(--muted); font-size: 12px; line-height: 1.4; }

    .switch {
      position: relative;
      width: 48px;
      height: 30px;
      flex: none;
      border-radius: 999px;
      background: #d5d7dc;
      transition: background-color 180ms ease;
    }

    .switch::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, .16);
      transition: transform 180ms ease;
    }

    .switch.is-on { background: var(--blue); }
    .switch.is-on::after { transform: translateX(18px); }

    .category-row {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      min-height: 72px;
      padding: 14px 20px;
      color: var(--text);
      background: var(--surface);
      border-top: 1px solid var(--line);
      text-align: left;
    }

    .category-row:first-of-type { border-top: 0; }
    .category-row:hover { background: #fafbfc; }
    .category-icon {
      display: grid;
      width: 36px;
      height: 36px;
      flex: none;
      place-items: center;
      border-radius: 12px;
      color: var(--blue);
      background: var(--blue-soft);
    }
    .category-icon svg { width: 19px; height: 19px; }
    .category-copy { min-width: 0; flex: 1; }
    .category-name { display: block; font-size: 15px; }
    .category-help { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; line-height: 1.4; }
    .chevron { color: #9aa0aa; font-size: 22px; line-height: 1; }

    .bottom-nav {
      position: fixed;
      right: 0;
      bottom: max(18px, env(safe-area-inset-bottom));
      left: 0;
      z-index: 5;
      display: flex;
      justify-content: center;
      pointer-events: none;
    }

    .bottom-pill {
      display: flex;
      gap: 8px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, .96);
      box-shadow: 0 10px 28px rgba(30, 36, 48, .14);
      pointer-events: auto;
    }

    .mode-button {
      display: grid;
      width: 48px;
      height: 48px;
      place-items: center;
      border-radius: 50%;
      color: #fff;
      background: #272a30;
      transition: transform 180ms ease, background-color 180ms ease;
    }

    .mode-button.is-active { color: #fff; background: var(--blue); }
    .mode-button:active { transform: scale(.94); }
    .mode-button svg { width: 21px; height: 21px; }

    .prototype-note {
      margin: 24px 3px 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    @media (min-width: 600px) {
      .screen { padding-top: 34px; }
    }
  </style>
</head>
<body data-variant="reference">
  <div class="prototype-banner">原型预览 · 仅确认设置层级与布局，不是最终 Android 页面</div>
  <main class="screen">
    <header class="topbar">
      <h1 id="page-title">常用设置</h1>
    </header>

    <section id="common-page" class="page is-active" aria-labelledby="page-title">
      <p class="section-label">灵动岛</p>
      <div class="card">
        <div class="switch-row">
          <div class="switch-copy">
            <div class="switch-name">显示灵动岛</div>
            <div class="switch-help">控制悬浮层是否显示在其他应用上方。</div>
          </div>
          <button class="switch is-on" type="button" aria-pressed="true" aria-label="显示灵动岛"></button>
        </div>
        <div class="switch-row">
          <div class="switch-copy">
            <div class="switch-name">向下展开</div>
            <div class="switch-help">只改变玻璃球弹出位置，胶囊位置保持不变。</div>
          </div>
          <button class="switch" type="button" aria-pressed="false" aria-label="向下展开"></button>
        </div>
      </div>

      <p class="section-label">尺寸与位置</p>
      <div class="card">
        <div class="card-heading">
          <div>
            <p class="card-title">胶囊</p>
          </div>
        </div>
        <label class="setting-row">
          <span class="setting-line"><span class="setting-name">胶囊宽度</span><output class="setting-value" data-value-for="capsule-width">118 dp</output></span>
          <span class="setting-help">控制纯黑不透明胶囊的横向长度。</span>
          <input id="capsule-width" type="range" min="0" max="220" value="118" data-unit="dp">
        </label>
        <label class="setting-row">
          <span class="setting-line"><span class="setting-name">胶囊高度</span><output class="setting-value" data-value-for="capsule-height">34 dp</output></span>
          <span class="setting-help">控制胶囊的纵向高度，不影响最小触控区域。</span>
          <input id="capsule-height" type="range" min="0" max="64" value="34" data-unit="dp">
        </label>
      </div>

      <div class="card">
        <div class="card-heading">
          <div>
            <p class="card-title">玻璃球</p>
          </div>
        </div>
        <label class="setting-row">
          <span class="setting-line"><span class="setting-name">玻璃球宽度</span><output class="setting-value" data-value-for="orb-width">128 dp</output></span>
          <span class="setting-help">调整球体横向尺寸。</span>
          <input id="orb-width" type="range" min="88" max="260" value="128" data-unit="dp">
        </label>
        <label class="setting-row">
          <span class="setting-line"><span class="setting-name">玻璃球高度</span><output class="setting-value" data-value-for="orb-height">128 dp</output></span>
          <span class="setting-help">调整球体纵向尺寸。</span>
          <input id="orb-height" type="range" min="88" max="260" value="128" data-unit="dp">
        </label>
      </div>

      <p class="section-label">显示行为</p>
      <div class="card">
        <div class="switch-row">
          <div class="switch-copy">
            <div class="switch-name">背景压暗</div>
            <div class="switch-help">展开时压暗范围随球体大小变化，收起时平滑消失。</div>
          </div>
          <button class="switch is-on" type="button" aria-pressed="true" aria-label="背景压暗"></button>
        </div>
        <div class="switch-row">
          <div class="switch-copy">
            <div class="switch-name">横屏隐藏</div>
            <div class="switch-help">横屏时隐藏灵动岛与触控区域，并使用过渡动画。</div>
          </div>
          <button class="switch" type="button" aria-pressed="false" aria-label="横屏隐藏"></button>
        </div>
      </div>
    </section>

    <section id="detail-page" class="page" aria-labelledby="page-title">
      <p class="section-label">全部设置</p>
      <div class="card">
        <button class="category-row" type="button"><span class="category-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h10" stroke-linecap="round"/></svg></span><span class="category-copy"><span class="category-name">位置与触控</span><span class="category-help">锚点、偏移、尺寸、触控倍率和横屏策略</span></span><span class="chevron">›</span></button>
        <button class="category-row" type="button"><span class="category-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="7"/><path d="M12 5V3m0 18v-2M5 12H3m18 0h-2" stroke-linecap="round"/></svg></span><span class="category-copy"><span class="category-name">颜色与光影</span><span class="category-help">内部颜色、高光、阴影与自动混合焦散</span></span><span class="chevron">›</span></button>
        <button class="category-row" type="button"><span class="category-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 14c2.5-8 5-8 8 0s5 8 8 0" stroke-linecap="round"/></svg></span><span class="category-copy"><span class="category-name">波形与粒子</span><span class="category-help">波形线条、色散、思考圆点与旋转</span></span><span class="chevron">›</span></button>
        <button class="category-row" type="button"><span class="category-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v18M3 12h18" stroke-linecap="round"/><circle cx="12" cy="12" r="8"/></svg></span><span class="category-copy"><span class="category-name">手势与动效</span><span class="category-help">展开、收起、拖动、回弹和自动收起</span></span><span class="chevron">›</span></button>
        <button class="category-row" type="button"><span class="category-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 17h4v3H4zm6-6h4v9h-4zm6-7h4v16h-4z" stroke-linejoin="round"/></svg></span><span class="category-copy"><span class="category-name">性能与清晰度</span><span class="category-help">帧率、渲染比例和静态胶囊省电策略</span></span><span class="chevron">›</span></button>
      </div>

      <p class="section-label">工具与应用</p>
      <div class="card">
        <button class="category-row" type="button"><span class="category-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 18v2h14v-2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="category-copy"><span class="category-name">预设与备份</span><span class="category-help">切换效果、导出或恢复配置</span></span><span class="chevron">›</span></button>
        <button class="category-row" type="button"><span class="category-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3"/><path d="M5 20c.8-3.2 3.1-5 7-5s6.2 1.8 7 5" stroke-linecap="round"/></svg></span><span class="category-copy"><span class="category-name">关于</span><span class="category-help">版本、权限边界与开源许可</span></span><span class="chevron">›</span></button>
      </div>
    </section>

    <p class="prototype-note">原型说明：底部蓝色圆点代表当前页面，黑色圆点代表另一页面；最终 Android 版本会使用原生 Material 控件，保留这里的单栏结构、模块分割和说明层级。</p>
  </main>

  <nav class="bottom-nav" aria-label="设置页面切换">
    <div class="bottom-pill">
      <button class="mode-button is-active" type="button" data-page="common" aria-label="常用设置" aria-pressed="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg>
      </button>
      <button class="mode-button" type="button" data-page="detail" aria-label="详细设置" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 7h14M5 12h14M5 17h9" stroke-linecap="round"/></svg>
      </button>
    </div>
  </nav>

  <script>
    const title = document.getElementById('page-title');
    const pages = { common: document.getElementById('common-page'), detail: document.getElementById('detail-page') };
    document.querySelectorAll('.mode-button').forEach((button) => {
      button.addEventListener('click', () => {
        const page = button.dataset.page;
        document.querySelectorAll('.mode-button').forEach((item) => {
          const active = item === button;
          item.classList.toggle('is-active', active);
          item.setAttribute('aria-pressed', String(active));
        });
        Object.entries(pages).forEach(([key, element]) => element.classList.toggle('is-active', key === page));
        title.textContent = page === 'common' ? '常用设置' : '详细设置';
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    });

    document.querySelectorAll('.switch').forEach((button) => {
      button.addEventListener('click', () => {
        const active = button.classList.toggle('is-on');
        button.setAttribute('aria-pressed', String(active));
      });
    });

    document.querySelectorAll('input[type="range"]').forEach((input) => {
      const output = document.querySelector(`[data-value-for="${input.id}"]`);
      const unit = input.dataset.unit || '';
      const update = () => { output.textContent = `${input.value} ${unit}`.trim(); };
      input.addEventListener('input', update);
      update();
    });

    const params = new URLSearchParams(window.location.search);
    if (params.get('variant') === 'compact') document.body.dataset.variant = 'compact';
  </script>
</body>
</html>
